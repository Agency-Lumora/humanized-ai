<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" fill="none" role="img" aria-label="Soft sculptural illustration for the Strategize step">
  <defs>
    <linearGradient id="s2-beige" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7EEE1" />
      <stop offset="100%" stop-color="#D9C3A3" />
    </linearGradient>
    <linearGradient id="s2-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D7ECF6" />
      <stop offset="55%" stop-color="#96C6E1" />
      <stop offset="100%" stop-color="#5E93B8" />
    </linearGradient>
    <radialGradient id="s2-dot" cx="35%" cy="30%" r="75%">
