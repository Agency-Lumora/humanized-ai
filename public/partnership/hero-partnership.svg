<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" fill="none" role="img" aria-label="Soft sculptural blue and beige organic forms">
  <defs>
    <linearGradient id="hp-beige" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7EEE1" />
      <stop offset="100%" stop-color="#D9C3A3" />
    </linearGradient>
    <linearGradient id="hp-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D7ECF6" />
      <stop offset="55%" stop-color="#96C6E1" />
      <stop offset="100%" stop-color="#5E93B8" />
    </linearGradient>
    <radialGradient id="hp-dot" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#5C4433" />
      <stop offset="100%" stop-color="#2D2016" />
    </radialGradient>
    <filter id="hp-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2A211D" flood-opacity="0.14" />
    </filter>
  </defs>

  <circle cx="200" cy="300" r="190" fill="url(#hp-beige)" opacity="0.95" />
  <circle cx="340" cy="230" r="200" fill="url(#hp-blue)" filter="url(#hp-shadow)" />

  <circle cx="470" cy="150" r="11" fill="url(#hp-dot)" />

  <path d="M 70 360 C 110 400 100 460 60 500" stroke="#8B6F57" stroke-width="1.4" stroke-linecap="round" opacity="0.5" fill="none" />
  <path d="M 380 420 C 410 450 400 490 430 510" stroke="#8B6F57" stroke-width="1.2" stroke-linecap="round" opacity="0.4" fill="none" />
</svg>
